services:
  transcripter:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_PATH: /data/transcripter.db
      WHISPER_MODEL_DIR: /data/models
    volumes:
      # Transcripts (and downloaded Whisper models) live here and survive rebuilds/upgrades.
      - ./data:/data
    restart: unless-stopped
